<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LosPerris API - Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.twitch.tv">
    <link rel="preconnect" href="https://id.twitch.tv">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/components/common.css">
    <link rel="stylesheet" href="./css/components/skeleton.css">
    <link rel="stylesheet" href="./css/components/loading.css">
    <link rel="stylesheet" href="./css/components/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/webp" href="./img/LosPerris_progra.webp">
    <script src="./js/vendor/tmi.min.js" defer></script>
</head>

<body>
    <div id="dashboard-page">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="img/LosPerris_progra.webp" alt="Logo" class="sidebar-logo" loading="lazy">
                <span class="brand-text">LosPerris<span class="accent-text">API</span></span>
            </div>

            <nav class="sidebar-menu">
                <div class="menu-category">General</div>
                <button class="nav-item active" data-tab="tab-home" aria-label="Ir a Inicio">
                    <i class="fa-solid fa-house" aria-hidden="true"></i>
                    <span class="nav-text">Inicio</span>
                </button>

                <div class="menu-category">Comandos</div>
                <button class="nav-item" data-tab="tab-followage" aria-label="Comando Followage">
                    <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
                    <span class="nav-text">Followage</span>
                </button>
                <button class="nav-item" data-tab="tab-clips" aria-label="Gestor de Clips">
                    <i class="fa-solid fa-film" aria-hidden="true"></i>
                    <span class="nav-text">Clips</span>
                </button>
                <button class="nav-item" data-tab="tab-shoutout" aria-label="Comando Shoutout">
                    <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>
                    <span class="nav-text">Shoutout</span>
                </button>

                <div class="menu-category">Herramientas</div>
                <button class="nav-item" data-tab="tab-tracker" aria-label="Herramienta Tendencias">
                    <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                    <span class="nav-text">Tendencias</span>
                </button>
                <button class="nav-item" data-tab="tab-stalker" aria-label="Herramienta Stalker">
                    <i class="fa-solid fa-users-viewfinder" aria-hidden="true"></i>
                    <span class="nav-text">Stalker</span>
                </button>
                <button class="nav-item" data-tab="tab-roulette" aria-label="Herramienta Ruleta">
                    <i class="fa-solid fa-dice" aria-hidden="true"></i>
                    <span class="nav-text">Ruleta</span>
                </button>

                <div class="menu-category">Minijuegos</div>
                <button class="nav-item" data-tab="tab-magic8" aria-label="Juego Bola 8">
                    <i class="fa-solid fa-8" aria-hidden="true"></i>
                    <span class="nav-text">Bola 8</span>
                </button>
                <button class="nav-item" data-tab="tab-russian" aria-label="Juego Ruleta Rusa">
                    <i class="fa-solid fa-skull-crossbones" aria-hidden="true"></i>
                    <span class="nav-text">Ruleta Rusa</span>
                </button>
                <button class="nav-item" data-tab="tab-duel" aria-label="Juego Duelo">
                    <i class="fa-solid fa-khanda" aria-hidden="true"></i>
                    <span class="nav-text">Duelo</span>
                </button>

                <div class="menu-category menu-separator">Soporte</div>
                <button class="nav-item" data-tab="tab-feedback" aria-label="Enviar Feedback">
                    <i class="fa-solid fa-comment-dots" aria-hidden="true"></i>
                    <span class="nav-text">Feedback</span>
                </button>
                <a href="docs" target="_blank" class="nav-item external-link">
                    <i class="fa-solid fa-book"></i>
                    <span class="nav-text">Documentación</span>
                </a>
                <a href="https://discord.gg/8uN3qY5E" target="_blank" class="nav-item external-link">
                    <i class="fa-brands fa-discord"></i>
                    <span class="nav-text">Discord</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="btn-logout" aria-label="Cerrar Sesión">
                    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span class="btn-text">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <h1 id="page-title">Bienvenido</h1>
                <div class="user-badge">
                    <img src="./img/LosPerris_progra.webp" id="user-avatar" alt="Avatar" style="display:none;"
                        loading="lazy">
                    <span id="user-display-name">Streamer</span>
                </div>
            </header>

            <div class="dashboard-content">
                <div id="tab-home" class="tab-pane active" data-src="./components/home.html"></div>
                <div id="tab-followage" class="tab-pane" data-src="./components/followage.html"></div>
                <div id="tab-clips" class="tab-pane" data-src="./components/clips.html"></div>
                <div id="tab-shoutout" class="tab-pane" data-src="./components/shoutout.html"></div>
                <div id="tab-tracker" class="tab-pane" data-src="./components/trends.html"></div>
                <div id="tab-stalker" class="tab-pane" data-src="./components/stalker.html"></div>
                <div id="tab-roulette" class="tab-pane" data-src="./components/roulette.html"></div>
                <div id="tab-magic8" class="tab-pane" data-src="./components/magic8.html"></div>
                <div id="tab-russian" class="tab-pane" data-src="./components/russian.html"></div>
                <div id="tab-duel" class="tab-pane" data-src="./components/duel.html"></div>
                <div id="tab-feedback" class="tab-pane" data-src="./components/feedback.html"></div>
            </div>

            <footer id="main-footer"></footer>
        </main>
    </div>
    <div id="profile-modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content profile-modal">
            <button id="close-modal-btn" class="profile-close-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="profile-modal-content">
            </div>
        </div>
    </div>

    <script type="module" src="./js/app-dashboard.js"></script>

</body>

</html>
