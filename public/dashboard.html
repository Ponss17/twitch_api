<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LosPerris API - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/components/common.css">
    <link rel="stylesheet" href="./css/sections/analytics.css">
    <link rel="stylesheet" href="./css/components/skeleton.css">
    <link rel="stylesheet" href="./css/components/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/webp" href="./img/LosPerris_progra.webp">
    <script src="./js/tmi.min.js" defer></script>
</head>

<body>
    <div id="dashboard-page">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="img/LosPerris_progra.webp" alt="Logo" class="sidebar-logo">
                <span class="brand-text">LosPerris<span class="accent-text">API</span></span>
            </div>

            <nav class="sidebar-menu">
                <div class="menu-category">General</div>
                <button class="nav-item active" data-tab="tab-home">
                    <i class="fa-solid fa-house"></i>
                    <span class="nav-text">Inicio</span>
                </button>

                <div class="menu-category">Comandos</div>
                <button class="nav-item" data-tab="tab-followage">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span class="nav-text">Followage</span>
                </button>
                <button class="nav-item" data-tab="tab-clips">
                    <i class="fa-solid fa-film"></i>
                    <span class="nav-text">Clips</span>
                </button>
                <button class="nav-item" data-tab="tab-shoutout">
                    <i class="fa-solid fa-bullhorn"></i>
                    <span class="nav-text">Shoutout</span>
                </button>

                <div class="menu-category">Herramientas</div>
                <button class="nav-item" data-tab="tab-tracker">
                    <i class="fa-solid fa-chart-line"></i>
                    <span class="nav-text">Tendencias</span>
                </button>
                <button class="nav-item" data-tab="tab-stalker">
                    <i class="fa-solid fa-users-viewfinder"></i>
                    <span class="nav-text">Stalker</span>
                </button>

                <div class="menu-category">Minijuegos</div>
                <button class="nav-item" data-tab="tab-magic8">
                    <i class="fa-solid fa-8"></i>
                    <span class="nav-text">Bola 8</span>
                </button>
                <button class="nav-item" data-tab="tab-roulette">
                    <i class="fa-solid fa-dice"></i>
                    <span class="nav-text">Ruleta</span>
                </button>

                <div class="menu-category menu-separator">Soporte</div>
                <button class="nav-item" data-tab="tab-feedback">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span class="nav-text">Feedback</span>
                </button>
                <a href="docs" target="_blank" class="nav-item external-link">
                    <i class="fa-solid fa-book"></i>
                    <span class="nav-text">Documentación</span>
                </a>
                <a href="https://discord.gg/8uN3qY5E" target="_blank" class="nav-item external-link">
                    <i class="fa-brands fa-discord"></i>
                    <span class="nav-text">Discord</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="btn-text">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <h1 id="page-title">Bienvenido</h1>
                <div class="user-badge">
                    <img src="./img/LosPerris_progra.webp" id="user-avatar" alt="Avatar" style="display:none;">
                    <span id="user-display-name">Streamer</span>
                </div>
            </header>

            <div class="dashboard-content">
                <div id="tab-home" class="tab-pane active" data-src="/components/home.html"></div>
                <div id="tab-followage" class="tab-pane" data-src="/components/followage.html"></div>
                <div id="tab-clips" class="tab-pane" data-src="/components/clips.html"></div>
                <div id="tab-shoutout" class="tab-pane" data-src="/components/shoutout.html"></div>
                <div id="tab-tracker" class="tab-pane" data-src="/components/trends.html"></div>
                <div id="tab-stalker" class="tab-pane" data-src="/components/stalker.html"></div>
                <div id="tab-roulette" class="tab-pane" data-src="/components/roulette.html"></div>
                <div id="tab-magic8" class="tab-pane" data-src="/components/magic8.html"></div>
                <div id="tab-feedback" class="tab-pane" data-src="/components/feedback.html"></div>
            </div>
    </div>
    <footer id="main-footer"></footer>
    </main>
    </div>

    <div id="profile-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="profile-header">
                <button id="close-modal-btn" class="profile-close-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="profile-avatar-container">
                <img id="modal-avatar" src="./img/LosPerris_progra.webp" class="profile-avatar-img">
            </div>
            <div class="profile-body">
                <div id="modal-name" class="profile-name">Usuario</div>
                <div id="modal-login" class="profile-login">@usuario</div>

                <div class="profile-stats">
                    <div class="stat-item">
                        <span id="modal-rank" class="stat-val" style="font-size: 1.2rem;">-</span>
                        <span class="stat-lbl">Rango</span>
                    </div>
                </div>

                <div class="profile-details-grid">
                    <div class="detail-item">
                        <span class="detail-lbl">ID Interno</span>
                        <span id="modal-id" class="detail-val">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-lbl">Antigüedad</span>
                        <span id="modal-age" class="detail-val">-</span>
                    </div>
                </div>

                <div id="modal-bio" class="profile-bio" style="margin-top: 20px;">
                    Sin biografía disponible.
                </div>
                <div id="modal-created" style="margin-top:20px; font-size:0.8rem; color:var(--text-muted);">
                    Cuenta creada el: -
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/app-dashboard.js"></script>
</body>

</html>
