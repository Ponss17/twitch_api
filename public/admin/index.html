<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch API Admin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Panel de Administración</h1>
            <button class="logout-btn" onclick="window.logout()">Cerrar Sesión</button>
        </header>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>API Key</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-secondary);">Cargando usuarios...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="/js/admin/dashboard.js"></script>
</body>

</html>
