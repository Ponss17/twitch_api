<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | LosPerris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --primary: #9146ff;
            --primary-glow: #bf94ff;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --error: #ff4545;
            --border: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roobert', 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-light {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #4a1d96;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 50px);
            }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px -12px rgba(145, 70, 255, 0.15);
            border-color: rgba(145, 70, 255, 0.3);
        }

        .logo-container {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(145, 70, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover .login-logo {
            transform: scale(1.1) rotate(5deg);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #bf94ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .auth-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            border-color: var(--primary);
            background: rgba(145, 70, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(145, 70, 255, 0.1);
        }

        .auth-input::placeholder {
            color: #555;
        }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover {
            background: #7a2bd9;
            box-shadow: 0 0 30px rgba(145, 70, 255, 0.4);
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        .error-msg {
            color: var(--error);
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .error-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
            display: none;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        .btn-primary.loading span {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="login-container">
        <div class="card fade-in">
            <div class="logo-container">
                <img src="/api/twitch/img/logo.svg" alt="Logo" class="login-logo" draggable="false">
            </div>

            <h1>Portal de Acceso Admin</h1>
            <p class="subtitle">Accede de forma segura con tu cuenta de Twitch habilitada</p>

            <div class="login-body">
                <a href="/api/twitch/auth/twitch?admin=true" id="loginBtn" class="btn-primary"
                    style="display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;">
                    <img src="https://unpkg.com/simple-icons@v11/icons/twitch.svg"
                        style="width: 20px; filter: brightness(0) invert(1);" alt="Twitch Logo">
                    <span>Entrar con Twitch</span>
                </a>
            </div>

            <p id="error" class="error-msg">No tienes permisos de administrador</p>
        </div>
    </div>

    <script type="module">
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('error');
        const apiBase = window.location.pathname.replace(/\/admin\/?$/, '');

        import(`./js/admin/auth.js`).then(module => {
            module.checkAuth();
        }).catch(err => {
            console.warn('Fallback to absolute path for auth.js');
            import(`/js/admin/auth.js`).then(m => m.checkAuth());
        });

        loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            console.log('Redirigiendo a Twitch OAuth...');
            loginBtn.style.opacity = '0.7';
            loginBtn.querySelector('span').textContent = 'Redirigiendo...';
            window.location.href = `${apiBase}/auth/twitch?admin=true`;
        });
    </script>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>

</html>
