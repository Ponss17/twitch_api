<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LosPerris Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/api/twitch/css/base.css">
    <link rel="stylesheet" href="/api/twitch/css/dashboard.css">
    <link rel="stylesheet" href="/api/twitch/admin/style.css">
</head>

<body>
    <div class="login-container">
        <div class="card login-form fade-in">
            <div class="login-header">
                <img src="/api/twitch/img/LosPerris_progra.webp" alt="Logo" class="login-logo">
                <h1>Admin Access</h1>
            </div>
            <div class="login-body">
                <input type="password" id="password" class="auth-input" placeholder="Contraseña de Administrador"
                    autofocus>
                <button onclick="login()" class="btn-primary btn-block">Entrar al Panel</button>
            </div>
            <p id="error" class="error-msg">Contraseña Incorrecta</p>
        </div>
    </div>

    <script type="module">
        import { setAdminPassword, fetchAdmin } from '/js/admin/auth.js';

        window.login = async () => {
            const password = document.getElementById('password').value;
            if (!password) return;

            setAdminPassword(password);

            try {
                const res = await fetchAdmin('/api/admin/users');
                if (res.ok) {
                    window.location.href = '/admin-dashboard';
                } else {
                    throw new Error('Unauthorized');
                }
            } catch (e) {
                document.getElementById('error').style.display = 'block';
                sessionStorage.removeItem('admin_password');
            }
        };

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.login();
        });
    </script>
</body>

</html>
