<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch API Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/api/twitch/css/base.css">
    <link rel="stylesheet" href="/api/twitch/css/dashboard.css">
    <link rel="stylesheet" href="/api/twitch/admin/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="dashboard-page" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="/api/twitch/img/LosPerris_progra.webp" alt="Logo" class="sidebar-logo">
                <span class="brand-text">LosPerris<span class="accent-text">Admin</span></span>
            </div>

            <nav class="sidebar-menu">
                <div class="menu-category">General</div>
                <button class="nav-item active">
                    <i class="fa-solid fa-users-gear" aria-hidden="true"></i>
                    <span class="nav-text">Usuarios</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" onclick="window.logout()">
                    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span class="btn-text">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <h1>Panel de Administración</h1>
                <div class="user-badge">
                    <span id="admin-badge">Admin Access</span>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="card fade-in" style="margin-bottom: 2rem;">
                    <div class="card-header">
                        <h3>Actividad de Usuarios</h3>
                    </div>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="usersChart"></canvas>
                    </div>
                </div>

                <div class="card fade-in">
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="card-icon">
                                <i class="fa-solid fa-users"></i>
                            </div>
                            <div>
                                <h3>Usuarios Registrados</h3>
                                <p class="card-desc">Gestiona el acceso y estado de las API Keys</p>
                            </div>
                        </div>
                        <div class="search-container">
                            <i class="fa-solid fa-search search-icon"></i>
                            <input type="text" id="user-search" placeholder="Buscar usuario..." class="search-input">
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Usuario</th>
                                    <th>API Key</th>
                                    <th>Estadísticas</th>
                                    <th>Límite</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <tr>
                                    <td colspan="4" class="loading-cell">
                                        <div class="loading-spinner"></div> Cargando...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/api/twitch/js/admin/dashboard.js"></script>
</body>

</html>
