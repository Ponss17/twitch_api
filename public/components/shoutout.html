<div id="command-card-shoutout"></div>

<div class="card">
    <div class="card-header">
        <div class="card-title-group">
            <div class="card-icon">
                <i class="fa-solid fa-flask"></i>
            </div>
            <div>
                <h3>Prueba el Shoutout</h3>
                <p class="card-desc">Previsualiza el mensaje antes de usarlo en directo</p>
            </div>
        </div>
        <div class="header-actions">
            <i class="fa-solid fa-circle-question info-icon"
                data-tooltip="Llama directamente a la API con el canal destino y muestra el mensaje de shoutout real, incluido el juego actual."></i>
        </div>
    </div>
    <div class="card-body">
        <div class="form-grid">
            <div class="form-group">
                <input type="text" id="so-test-channel" placeholder="Tu canal" class="text-input">
            </div>
            <div class="form-group">
                <input type="text" id="so-test-touser" placeholder="Canal a shoutoutear" class="text-input">
            </div>
        </div>
        <button id="run-so-test-btn" class="btn-primary" style="margin-top: 20px;">
            <i class="fa-solid fa-play"></i> Probar Shoutout
        </button>
        <div id="so-test-result-container" class="response-card">
            <div id="so-test-result-text" style="width:100%"></div>
        </div>
    </div>
</div>
