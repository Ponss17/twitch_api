<div class="card fade-in">
    <div class="card-header">
        <h2><i class="fa-solid fa-skull-crossbones"></i> Ruleta Rusa</h2>
    </div>
    <div class="card-body text-center">

        <div class="russian-visuals" style="margin: 20px 0;">
            <i class="fa-solid fa-gun fa-4x" id="russian-gun-icon"
                style="color: var(--text-muted); transition: all 0.2s;"></i>
        </div>

        <div class="game-controls">
            <div class="form-group checkbox-group" style="justify-content: center; margin-bottom: 2rem;">
                <input type="checkbox" id="russian-hardcore" name="hardcore">
                <label for="russian-hardcore" style="color: var(--danger-color); font-weight: bold;">
                    Modo Hardcore (Timeout 60s)
                </label>
            </div>

            <button id="btn-fire-russian" class="btn-primary" style="font-size: 1.2rem; padding: 10px 30px;">
                <i class="fa-solid fa-person-rifle"></i> Jalar Gatillo
            </button>
        </div>

        <div id="russian-result" class="result-box hidden" style="margin-top: 20px; padding: 15px; border-radius: 8px;">
            <p id="russian-message" style="font-size: 1.1rem;"></p>
        </div>

    </div>
</div>
