<div id="command-card-clip"></div>

<div class="card">
    <div class="card-header">
        <div class="card-title-group">
            <div class="card-icon">
                <i class="fa-solid fa-images"></i>
            </div>
            <div>
                <h3>Clips Recientes</h3>
                <p class="card-desc">Los últimos clips de tu canal</p>
            </div>
        </div>
        <div class="header-actions header-actions-flex">
            <button id="refresh-clips-btn" class="btn-icon" title="Recargar lista de clips">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <i class="fa-solid fa-circle-question info-icon"
                data-tooltip="Galería de tus clips más recientes. Se actualiza automáticamente."></i>
        </div>
    </div>
    <div class="card-body">
        <div class="clips-toolbar">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="clips-search" placeholder="Buscar clips...">
            </div>
            <div class="sort-box">
                <select id="clips-sort">
                    <option value="date-desc">Más recientes</option>
                    <option value="date-asc">Más antiguos</option>
                    <option value="views-desc">Más vistos</option>
                    <option value="views-asc">Menos vistos</option>
                </select>
            </div>
        </div>
        <div id="clips-gallery" class="clips-grid">
        </div>
    </div>
</div>
