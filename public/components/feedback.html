<div class="card">
    <div class="card-header">
        <div class="card-icon">
            <i class="fa-solid fa-comment-dots"></i>
        </div>
        <div>
            <h3>Feedback & Sugerencias</h3>
            <p class="card-desc">Ayúdanos a mejorar LosPerris API</p>
        </div>
    </div>
    <div class="card-body">
        <div class="form-group">
            <label>Tu Mensaje</label>
            <textarea id="feedback-message" rows="6" class="text-input"
                style="width:100%; resize:vertical; background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-primary); padding:15px; border-radius:8px; outline:none;"
                placeholder="Cuéntanos qué te gustaría ver, reporta un bug, o danos tu opinión..."></textarea>
        </div>
        <div style="margin-top:20px; text-align:right;">
            <button id="send-feedback-btn" class="btn-primary">
                <i class="fa-solid fa-paper-plane"></i> Enviar Feedback
            </button>
        </div>
        <p style="margin-top:15px; font-size:0.8rem; color:var(--text-muted); text-align:center;">
            * Tu mensaje se enviará directamente a nuestro servidor de Discord.
        </p>
    </div>
</div>
