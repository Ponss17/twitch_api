<div class="card">
    <div class="card-header">
        <div class="card-title-group">
            <div class="card-icon">
                <i class="fa-solid fa-comment-dots"></i>
            </div>
            <div>
                <h3>Feedback & Sugerencias</h3>
                <p class="card-desc">Ayúdanos a mejorar LosPerris API</p>
            </div>
        </div>
        <div class="header-actions">
            <i class="fa-solid fa-circle-question info-icon"
                data-tooltip="Tu mensaje llegará directo a nuestro Discord. ¡Gracias por ayudarnos a mejorar!"></i>
        </div>
    </div>
    <div class="card-body">
        <div class="form-group">
            <label class="input-label">Tu Mensaje</label>
            <textarea id="feedback-message" class="textarea-xl"
                placeholder="Cuéntanos qué te gustaría ver, reporta un bug, o danos tu opinión..."></textarea>
        </div>

        <div class="card-footer-flex">
            <p style="font-size:0.8rem; color:var(--text-muted); max-width: 60%;">
                <i class="fa-solid fa-shield-halved"></i> Tu mensaje se enviará de forma segura y anónima a nuestro
                servidor de Discord.
            </p>
            <button id="send-feedback-btn" class="btn-primary">
                <i class="fa-solid fa-paper-plane"></i> Enviar Feedback
            </button>
        </div>
    </div>
</div>
