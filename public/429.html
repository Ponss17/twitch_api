<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 - Límite Excedido | LosPerris API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/error.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
</head>

<body>
    <div class="error-page">
        <div class="floating-shapes">
            <div class="shape-1"></div>
            <div class="shape-2"></div>
        </div>

        <div class="error-container">
            <div class="error-code">Seguridad</div>
            <h1 class="error-title">¡Wow, vas muy rápido!</h1>
            <p class="error-message">Has excedido el límite de peticiones. Por seguridad, hemos activado un breve periodo de espera para proteger tu cuenta.</p>

            <div class="cooldown-timer">
                <i class="fa-regular fa-clock"></i>
                <span id="timer-display">05:00</span>
            </div>

            <button id="retry-btn" class="btn-retry" disabled>
                <i class="fa-solid fa-lock"></i> <span id="btn-text">Bloqueado</span>
            </button>
        </div>
    </div>

    <script nonce="{{cspNonce}}">
        document.addEventListener('DOMContentLoaded', () => {
            const COOLDOWN_MINUTES = 5;
            const timerDisplay = document.getElementById('timer-display');
            const retryBtn = document.getElementById('retry-btn');
            const btnText = document.getElementById('btn-text');

            let cooldownEnd = localStorage.getItem('rate_limit_cooldown');
            const now = Date.now();

            // Si no hay cooldown previo o el anterior ya expiró, iniciamos uno nuevo
            if (!cooldownEnd || parseInt(cooldownEnd) < now) {
                cooldownEnd = now + (COOLDOWN_MINUTES * 60 * 1000);
                localStorage.setItem('rate_limit_cooldown', cooldownEnd.toString());
            } else {
                cooldownEnd = parseInt(cooldownEnd);
            }

            function updateTimer() {
                const timeLeft = cooldownEnd - Date.now();

                if (timeLeft <= 0) {
                    timerDisplay.textContent = "00:00";
                    retryBtn.disabled = false;
                    retryBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Intentar de nuevo';
                    retryBtn.onclick = () => window.location.reload();
                    localStorage.removeItem('rate_limit_cooldown');
                    return;
                }

                const minutes = Math.floor(timeLeft / 60000);
                const seconds = Math.floor((timeLeft % 60000) / 1000);

                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                requestAnimationFrame(updateTimer);
            }

            updateTimer();
        });
    </script>
</body>

</html>
