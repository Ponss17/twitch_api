name: CI
on: [push, pull_request]

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Type Check
              run: pnpm run type-check

            - name: Tests
              run: pnpm test

            - name: Build
              run: pnpm run build
