name: Avisar a LosPerris (actualizaciones)

# Dispara sync-github-updates en Ponss17/LosPerris tras cada push a master.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sync en LosPerris
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $LOS_PERRIS_DISPATCH_TOKEN" \
            https://api.github.com/repos/Ponss17/LosPerris/dispatches \
            -d '{"event_type":"sync-updates"}'
        env:
          LOS_PERRIS_DISPATCH_TOKEN: ${{ secrets.LOS_PERRIS_DISPATCH_TOKEN }}
