allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  yaml: "2.9.0"
  # js-yaml 3 arrastra argparse@1 → sprintf-js (GHSA-hp3w-g68c-fv3c, sin release parcheado).
  # El único consumidor es @istanbuljs/load-nyc-config, que llama a .load(). js-yaml 4 lo conserva y usa argparse 2, sin sprintf-js.
  js-yaml@3: "4.3.2"
  js-yaml@4: "4.3.2"
  sharp: "0.35.5"
  svgo: "4.1.0"
  postcss: "^8.5.25"
  esbuild: "0.28.1"
  "@types/hast": "3.0.4"
  fast-uri: ">=3.1.9"
  fast-uri@3: "3.1.9"
  brace-expansion@1: "1.1.21"
  brace-expansion@2: "2.1.7"
  brace-expansion@5: "5.0.12"
  proxy-addr: ">=2.0.8"
  shell-quote: ">=1.11.0"
  handlebars: ">=4.7.10"
  http-cache-semantics: ">=4.3.0"
  source-map-js: ">=1.2.2"
  compression: ">=1.8.2"
  qs: ">=6.16.1"
  smol-toml: ">=1.9.1"
  postcss-selector-parser: "7.1.6"
  axios: "^1.16.0"
  follow-redirects: ">=1.16.2"
  body-parser: ">=2.4.0"
  undici: ">=8.12.2"
  vite: ">=8.1.6"
  zod: ">=4.6.6"
  minimatch@9: "11.0.5"
  minimatch@10: "11.0.5"
  devalue: "^5.9.1"
  nanoid: "^3.3.18"
  # astro-eslint-parser 1.x usa fast-glob → micromatch → braces (GHSA-vfj7-8cjw-p6xm, sin release).
  # 2.1.0 pasa a tinyglobby. El plugin 1.7 lo importa por ESM (parseForESLint / parseTemplate).
  "eslint-plugin-astro>astro-eslint-parser": "2.1.0"

auditConfig:
  ignoreGhsas:
    # contested / withdrawn; no patched release (dev micromatch tooling only)
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js: sin release parchado; solo via jest → js-yaml@3 → argparse (dev)
    - GHSA-hp3w-g68c-fv3c
    - GHSA-mh99-v99m-4gvg
    # deepmerge: sin release parchado; solo jest-config (dev). CVE disputado/rechazado.
    - GHSA-gcqx-w48m-w2h4

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.1'
  - astro@7.3.2 || 7.3.3
  - brace-expansion@1.1.21 || 2.1.7 || 5.0.12
  - body-parser@2.4.0
  - compression@1.8.2
  - fast-uri@3.1.9
  - follow-redirects@1.16.2
  - handlebars@4.7.10
  - http-cache-semantics@4.3.0
  - js-yaml@4.3.2
  - minimatch@11.0.5
  - postcss-selector-parser@7.1.6
  - proxy-addr@2.0.8
  - qs@6.16.1
  - sharp@0.35.5
  - shell-quote@1.12.0
  - smol-toml@1.9.1
  - source-map-js@1.2.2
  - svgo@4.1.0
  - undici@8.12.2
  - vite@8.1.6
  - zod@4.6.6
  - '@isaacs/nonrecursive-glob-match@1.1.0'
