allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  yaml: "2.9.0"
  js-yaml@3: "3.15.2"
  js-yaml@4: "4.3.2"
  sharp: "0.35.5"
  svgo: "4.1.0"
  postcss: "^8.5.25"
  esbuild: "0.28.1"
  "@types/hast": "3.0.4"
  fast-uri: ">=3.1.8"
  fast-uri@3: "3.1.8"
  brace-expansion@1: "1.1.21"
  brace-expansion@2: "2.1.7"
  brace-expansion@5: "5.0.12"
  proxy-addr: ">=2.0.8"
  shell-quote: ">=1.11.0"
  handlebars: ">=4.7.10"
  http-cache-semantics: ">=4.3.0"
  source-map-js: ">=1.2.2"
  compression: ">=1.8.2"
  qs: ">=6.16.0"
  smol-toml: ">=1.9.1"
  # Force 7.1.6 even for postcss-nested@6 (API compatible for Starlight/expressive-code)
  postcss-selector-parser: "7.1.6"
  axios: "^1.16.0"
  devalue: "^5.9.1"
  nanoid: "^3.3.18"

auditConfig:
  ignoreGhsas:
    # contested / no patched release yet (dev micromatch/eslint only)
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js: sin release parchado; solo via jest → js-yaml@3 → argparse (dev)
    - GHSA-hp3w-g68c-fv3c
    - GHSA-mh99-v99m-4gvg
    - GHSA-7p8r-x3mc-p8w7

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.1'
  - astro@7.3.2
  - brace-expansion@1.1.21
  - brace-expansion@2.1.7
  - brace-expansion@5.0.12
  - compression@1.8.2
  - fast-uri@3.1.8
  - handlebars@4.7.10
  - http-cache-semantics@4.3.0
  - js-yaml@3.15.2
  - js-yaml@4.3.2
  - postcss-selector-parser@7.1.6
  - proxy-addr@2.0.8
  - sharp@0.35.5
  - shell-quote@1.12.0
  - smol-toml@1.9.1
  - source-map-js@1.2.2
  - svgo@4.1.0
